name: Production Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows (Self-contained EXE)
        run: |
          dotnet publish -c Release -r win-x64 -o ./publish-win -p:PublishSingleFile=true --self-contained true
          zip -r sql-telemetry-injector-win-x64.zip ./publish-win

      - name: Publish Cross-Platform (Framework Dependent)
        run: |
          dotnet publish -c Release -o ./publish-cross
          zip -r sql-telemetry-injector-crossplatform.zip ./publish-cross

      - name: Verify release archives
        shell: bash
        run: |
          set -euxo pipefail
          test -s sql-telemetry-injector-win-x64.zip
          test -s sql-telemetry-injector-crossplatform.zip
          df -h "${RUNNER_TEMP:-/tmp}"
    
      - name: Upload Windows release asset
        uses: softprops/action-gh-release@v2
        with:
          files: sql-telemetry-injector-win-x64.zip
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
      - name: Upload cross-platform release asset
        uses: softprops/action-gh-release@v2
        with:
          files: sql-telemetry-injector-crossplatform.zip
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
